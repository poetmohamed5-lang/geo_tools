name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in *.zip; do unzip -o "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: geo_tools
        run: |
          flutter create . --platforms android --org com.yallabanking --project-name geo_tools
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: geo_tools-apk
          path: geo_tools/build/app/outputs/flutter-apk/app-release.apk
